<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E4002B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8001F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rentokil wordmark -->
  <text x="0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="url(#logoGradient)">
    Rentokil
  </text>
  <!-- Tagline -->
  <text x="0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" class="tagline" fill="currentColor">
    The Experts in Pest Control
  </text>
</svg>
